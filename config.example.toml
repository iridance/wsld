# 複製到 %APPDATA%\wsld\config.toml
# 0.5：多 machine profile＋單一 active；舊扁平格式載入時會自動遷移。

active = "Ubuntu-26.04"
# theme = "system"       # light | dark | system
# lan_access = false     # wsld-gui 在內網 IP 轉發容器 published 埠（Settings › Network）
# exec_shell = ""
# refresh_interval_sec = 3
# tray_autostart = false
# api_timeout_sec = 10
# lang = "en"            # en | zh-TW；GUI 右下角切換後會寫回這裡（WSLD_LANG 環境變數可強制覆寫）

[[machines]]
distro = "Ubuntu-26.04"
user = "irice"
api_endpoint = "tcp://127.0.0.1:23750"
# k8s = true             # 此 machine 開啟單節點 k3s（預設關；全部 machine 最多一台；wsld k8s on 會幫你寫）
